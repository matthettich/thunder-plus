# TESTS: every push to beta and every pull request runs the Node tests and the sequencer goldens.
# The sequencer goldens need a browser (headless Chrome), so `npm test` alone does not run them: three of them were
# stale for two days in Nov 2026 without anyone noticing. The runner image ships Google Chrome; playwright is only the driver.
name: Tests
on:
  push:
    branches: [beta]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: acorn (some tests cut functions out of index.html with it; they skip without it)
        run: npm i --no-save --no-audit --no-fund acorn@8 acorn-walk@8
      - name: Node tests (npm test)
        run: npm test -- --test-reporter=tap | tee node-tests.tap
      - name: Say loudly which tests SKIPPED (a skipped test checks nothing)
        if: always()
        run: |
          # Several older tests compare with an old build read by `git show <commit>`; this checkout is shallow, so they skip.
          # Their skips are listed here and in the run summary instead of passing silently.
          grep -E '^\s*(not )?ok [0-9]+ - .*# SKIP' node-tests.tap | sed -E 's/^\s*(not )?ok [0-9]+ - //' | sort > skipped.txt || true
          n=$(wc -l < skipped.txt)
          echo "::warning title=Node tests skipped in CI::$n tests SKIPPED (history-based or acorn): see the run summary"
          { echo "### Skipped Node tests: $n"; echo; sed 's/^/- /' skipped.txt; } >> "$GITHUB_STEP_SUMMARY"
          cat skipped.txt
      - name: Playwright driver (no browser download; the image has Chrome)
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i --no-save --no-audit --no-fund playwright@1.56.1
      - name: Sequencer goldens (page sequencer)
        run: PLAYWRIGHT="$PWD/node_modules/playwright/index.mjs" node tools/seq-golden.mjs
      - name: Sequencer goldens (audio-thread core)
        run: PLAYWRIGHT="$PWD/node_modules/playwright/index.mjs" node tools/seq-golden.mjs --core
