# NATIVE PORT (branch `native` only; WORKPLAN docs/port/WORKPLAN.md). Builds the C++ core and the shells.
# Runs only for pushes to `native` and PRs into it, and only when native/** (or this file) changed.
name: Native

on:
  push:
    branches: [native]
    paths: ['native/**', '.github/workflows/native.yml']
  pull_request:
    branches: [native]
    paths: ['native/**', '.github/workflows/native.yml']
  workflow_dispatch:
    inputs:
      release:
        description: 'Attach the debug APK to a GitHub PRE-release (test build; never touches the desktop app)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Core (Linux, ctest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S native -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure -V -R 'bench_put|core_pattern'
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: thunder_core-linux-x64
          path: build/core/libthunder_core.a
          retention-days: 7

  wasm:
    name: Core (wasm, wasi-sdk)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WASI_SDK_VERSION: '25'
    steps:
      - uses: actions/checkout@v4
      # A pinned wasi-sdk is downloaded in the job (never vendored). Same compiler flags as dsp/build.sh.
      - name: Fetch wasi-sdk
        run: |
          curl -fsSL -o wasi-sdk.tar.gz "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz"
          mkdir wasi-sdk && tar -xzf wasi-sdk.tar.gz -C wasi-sdk --strip-components=1
          wasi-sdk/bin/clang --version | head -1
      - name: Build thunder_core.wasm
        run: |
          SDK="$PWD/wasi-sdk"
          mkdir -p out
          # The core is built WITHOUT -ffast-math and without fused multiply-add, as native/core/CMakeLists.txt builds it: its
          # values must equal the web copy's bit for bit (U05). (The effects in dsp/ keep their own flags.)
          "$SDK/bin/clang++" --target=wasm32-wasi --sysroot="$SDK/share/wasi-sysroot" \
            -O3 -ffp-contract=off -msimd128 -fno-exceptions -fno-rtti -std=c++17 -Wall -Wextra \
            -Inative/core/include -Inative/core/src \
            native/core/src/core.cpp native/core/src/rt/auto.cpp native/core/src/rt/jsmath.cpp \
            native/core/src/rt/json.cpp native/core/src/song/song.cpp \
            -mexec-model=reactor -Wl,--export=_initialize \
            -Wl,--export=thunder_create -Wl,--export=thunder_process -Wl,--export=thunder_post \
            -Wl,--export=thunder_poll -Wl,--export=thunder_put -Wl,--export=thunder_destroy \
            -Wl,--strip-all -o out/thunder_core.wasm
          ls -l out/thunder_core.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: thunder_core-wasm
          path: out/thunder_core.wasm
          retention-days: 7
      # U02: the existing C++ DSP (tfx, thunder-dsp, mods) from CMake with the same wasi-sdk, pinned upstreams (third_party/PINS.md).
      - name: Build tfx / thunder-dsp / mods / pump / pump-synth wasm from CMake (U02, U03)
        run: WASI_SDK="$PWD/wasi-sdk" native/tools/build-wasm.sh "$RUNNER_TEMP/u02-wasm"
      # U02 gate: the golden tests rendered through the CMake-built wasm (copy of the tree; committed files untouched).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parity u02 (goldens through the CMake wasm)
        run: WASI_SDK="$PWD/wasi-sdk" PARITY_SKIP_BUILD=1 native/tools/parity.sh u02 "$RUNNER_TEMP/u02-wasm"
      # U03 gate: pump-synth golden + every test that loads the pump wasm, through the CMake-built pump.wasm / pump-synth.wasm
      # (build-wasm.sh above built them into the same folder), plus pump's own wasm/compare for the nine mastering effects.
      - name: Parity u03 (pump goldens through the CMake wasm)
        run: WASI_SDK="$PWD/wasi-sdk" PARITY_SKIP_BUILD=1 native/tools/parity.sh u03 "$RUNNER_TEMP/u02-wasm"
      - uses: actions/upload-artifact@v4
        with:
          name: thunder_dsp-wasm-u02
          path: |
            ${{ runner.temp }}/u02-wasm/tfx.wasm
            ${{ runner.temp }}/u02-wasm/thunder-dsp.wasm
            ${{ runner.temp }}/u02-wasm/mods.wasm
            ${{ runner.temp }}/u02-wasm/pump.wasm
            ${{ runner.temp }}/u02-wasm/pump-synth.wasm
          retention-days: 7

  windows:
    name: Core (Windows x64, MSVC)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S native -B build -A x64
      - run: cmake --build build --config Release -j
      - run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: thunder_core-windows-x64
          path: build/core/Release/thunder_core.lib
          retention-days: 7

  macos:
    name: Core (macOS universal)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: brew install gnu-sed   # native/core/third_party/prepare.sh needs GNU sed
      - run: cmake -S native -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure
      - run: lipo -info build/core/libthunder_core.a
      - uses: actions/upload-artifact@v4
        with:
          name: thunder_core-macos-universal
          path: build/core/libthunder_core.a
          retention-days: 7

  android-core:
    name: Core (Android arm64-v8a, NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build with the runner's NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "NDK: $NDK"
          cmake -S native -B build -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DCMAKE_BUILD_TYPE=Release -DTHUNDER_BUILD_TESTS=OFF
          cmake --build build -j
          file build/core/libthunder_core.a || true
      - uses: actions/upload-artifact@v4
        with:
          name: thunder_core-android-arm64
          path: build/core/libthunder_core.a
          retention-days: 7

  android-apk:
    name: Android shell v0 (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK pieces (pinned)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
      - name: Assemble the debug APK
        run: gradle -p native/android :app:assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: |
          mkdir -p out
          cp native/android/app/build/outputs/apk/debug/app-debug.apk "out/thunder-plus-native-n0-android-${{ github.run_number }}.apk"
          sha256sum out/*.apk | tee out/SHA256.txt
          ls -l out
          unzip -l out/*.apk | grep -E 'lib/|assets/index.html|assets/bridge-test|classes.*dex|\.wasm' | head -30
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging out/*.apk | grep -E 'package:|sdkVersion|uses-permission|native-code|service' 
      - uses: actions/upload-artifact@v4
        with:
          name: thunder-plus-native-n0-android-apk
          path: out/
          retention-days: 30

  android-release:
    name: Attach the APK to a pre-release
    needs: android-apk
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[release-apk]')) || (github.event_name == 'workflow_dispatch' && inputs.release) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: thunder-plus-native-n0-android-apk
          path: out
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: native-n0-android-${{ github.run_number }}
        run: |
          # A PRE-release with a tag that is not v<number>: the desktop updater reads /releases/latest (never a pre-release)
          # and only tags of the form v<digit>. --latest=false keeps GitHub from ever calling this one "latest".
          gh release create "$TAG" out/*.apk out/SHA256.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "NATIVE TEST BUILD N0 (Android, run ${{ github.run_number }}): not the desktop app" \
            --notes "Test build of the Thunder Plus native spike (stage N0). Android debug APK, sideload only. It is NOT a release of the desktop app and the desktop updater ignores it. Steps: native/tests/OWNER-TEST-N0.md on the native branch. Commit: $GITHUB_SHA"
