# NATIVE PORT (branch `native` only; WORKPLAN docs/port/WORKPLAN.md). Builds the C++ core and the shells.
# Runs only for pushes to `native` and PRs into it, and only when native/** (or this file) changed.
name: Native

on:
  push:
    branches: [native]
    paths: ['native/**', '.github/workflows/native.yml']
  pull_request:
    branches: [native]
    paths: ['native/**', '.github/workflows/native.yml']
  workflow_dispatch:
    inputs:
      release:
        description: 'Attach the APKs (the N0 debug build, and the beta / stable release builds) to GitHub PRE-releases (never touches the desktop app)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  # a release run (push to native, or a manual run) is never cancelled half way (beta published, stable cancelled); only pull-request runs are superseded
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job per pass (GCC, clang, sanitizers) so each has its own time limit (60 minutes; 120 for the sanitizers, whose ctest alone takes about 55 minutes on the runner: PRs #246 / #247 were CANCELLED at 60) and they run in parallel. fail-fast is off: one push
  # shows which compiler or sanitizer a failure belongs to.
  linux:
    name: Core (Linux, ${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pass: gcc, name: GCC, timeout: 60 }
          - { pass: clang, name: clang, timeout: 60 }
          - { pass: san, name: sanitizers, timeout: 120 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4   # the goldens' reference JS engine: Node 22 (as tests.yml); another V8 may differ in the last bit of Math.pow
        with: { node-version: 22 }
      # native/tools/fx-src.mjs cuts the effect host's reference out of index.html with acorn (as tests.yml); without it the fx_ref fixture
      # exits 1 under CI (it skips only on a developer machine). Installed at the repo root: the tool looks in <repo>/node_modules.
      - name: acorn (the fx reference tool)
        run: npm i --no-save --no-audit --no-fund acorn@8
      - if: ${{ matrix.pass == 'gcc' }}
        run: cmake -S native -B build -DCMAKE_BUILD_TYPE=Release
      - if: ${{ matrix.pass == 'gcc' }}
        run: cmake --build build -j
      - name: Toolchain
        run: c++ --version | head -1; clang++ --version | head -1; ldd --version | head -1; node --version
      - if: ${{ matrix.pass == 'gcc' }}
        run: ctest --test-dir build --output-on-failure -V -R 'bench_put|core_pattern'
      - if: ${{ matrix.pass == 'gcc' }}
        run: ctest --test-dir build --output-on-failure
      # U04: the CLOSED configuration (THUNDER_WITH_LXR=OFF: nothing of the GPL module is configured, built or linked): a small extra build with the seam's test (an LXR voice is refused,
      # another engine renders the same), the pump synths' refusal path (pumpsynth_refused: THUNDER_WITH_PUMP=OFF, every instrument refused) and the boundary check over its binaries. The open configuration is the build above (test_lxr, lxr_fuzz, lxr_seam, rt_core).
      - name: Closed build (THUNDER_WITH_LXR=OFF)
        if: ${{ matrix.pass == 'gcc' }}
        run: |
          cmake -S native -B build-closed -DCMAKE_BUILD_TYPE=Release -DTHUNDER_WITH_LXR=OFF -DTHUNDER_WITH_DSP=OFF -DTHUNDER_WITH_PUMP=OFF
          cmake --build build-closed -j --target test_lxr_seam test_pumpsynth_refused
          ctest --test-dir build-closed --output-on-failure -R 'lxr_seam|lxr_boundary|pumpsynth_refused'
      # The same tests with clang (the compiler of macOS and Android), in a third build directory.
      - name: clang
        if: ${{ matrix.pass == 'clang' }}
        run: |
          CXX=clang++ CC=clang cmake -S native -B build-clang -DCMAKE_BUILD_TYPE=Release
          cmake --build build-clang -j
          ctest --test-dir build-clang --output-on-failure
      # N1 review fixes: the same tests again under AddressSanitizer + UBSan (undefined behaviour is fatal), in a second build directory.
      - name: Sanitizers (ASan + UBSan)
        if: ${{ matrix.pass == 'san' }}
        run: |
          cmake -S native -B build-san -DCMAKE_BUILD_TYPE=Release -DTHUNDER_SANITIZE=ON
          cmake --build build-san -j4   # bounded: an unbounded -j made the runner lose communication / shut down mid-build three times on PR #311 (memory)
          ctest --test-dir build-san --output-on-failure
      - if: ${{ matrix.pass == 'gcc' }}
        uses: actions/upload-artifact@v4
        with:
          name: thunder_core-linux-x64
          path: build/core/libthunder_core.a
          retention-days: 7

  wasm:
    name: Core (wasm, wasi-sdk)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WASI_SDK_VERSION: '25'
    steps:
      - uses: actions/checkout@v4
      # A pinned wasi-sdk is downloaded in the job (never vendored). Same compiler flags as dsp/build.sh.
      - name: Fetch wasi-sdk
        run: |
          curl -fsSL -o wasi-sdk.tar.gz "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz"
          mkdir wasi-sdk && tar -xzf wasi-sdk.tar.gz -C wasi-sdk --strip-components=1
          wasi-sdk/bin/clang --version | head -1
      - name: Build thunder_core.wasm
        run: |
          SDK="$PWD/wasi-sdk"
          mkdir -p out
          # The core is built WITHOUT -ffast-math and without fused multiply-add, as native/core/CMakeLists.txt builds it: its
          # values must equal the web copy's bit for bit (U05). (The effects in dsp/ keep their own flags.)
          "$SDK/bin/clang++" --target=wasm32-wasi --sysroot="$SDK/share/wasi-sysroot" \
            -O3 -ffp-contract=off -msimd128 -fno-exceptions -fno-rtti -std=c++17 -Wall -Wextra \
            -Inative/core/include -Inative/core/src -isystem native/core/third_party \
            native/core/src/core.cpp native/core/src/rt/auto.cpp native/core/src/rt/jsmath.cpp \
            native/core/src/rt/json.cpp native/core/src/song/song.cpp \
            -mexec-model=reactor -Wl,--export=_initialize \
            -Wl,--export=thunder_create -Wl,--export=thunder_process -Wl,--export=thunder_post \
            -Wl,--export=thunder_poll -Wl,--export=thunder_put -Wl,--export=thunder_destroy \
            -Wl,--strip-all -o out/thunder_core.wasm
          ls -l out/thunder_core.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: thunder_core-wasm
          path: out/thunder_core.wasm
          retention-days: 7
      # U02: the existing C++ DSP (tfx, thunder-dsp, mods) from CMake with the same wasi-sdk, pinned upstreams (third_party/PINS.md).
      - name: Build tfx / thunder-dsp / mods / pump / pump-synth wasm from CMake (U02, U03)
        run: WASI_SDK="$PWD/wasi-sdk" native/tools/build-wasm.sh "$RUNNER_TEMP/u02-wasm"
      # U02 gate: the golden tests rendered through the CMake-built wasm (copy of the tree; committed files untouched).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parity u02 (goldens through the CMake wasm)
        run: WASI_SDK="$PWD/wasi-sdk" PARITY_SKIP_BUILD=1 native/tools/parity.sh u02 "$RUNNER_TEMP/u02-wasm"
      # U03 gate: pump-synth golden + every test that loads the pump wasm, through the CMake-built pump.wasm / pump-synth.wasm
      # (build-wasm.sh above built them into the same folder), plus pump's own wasm/compare for the nine mastering effects.
      - name: Parity u03 (pump goldens through the CMake wasm)
        run: WASI_SDK="$PWD/wasi-sdk" PARITY_SKIP_BUILD=1 native/tools/parity.sh u03 "$RUNNER_TEMP/u02-wasm"
      # U18 gate: the pump effects as slot kinds of the track-effect host against the real worklet running the pump.wasm that build-wasm.sh just built from the pin (-100 dB below each case's peak, the worst printed; the
      # exact cases still exact; the native render's committed hashes). Needs acorn (fx-src.mjs cuts the worklet out of index.html). The native test build is made here too (c++ of the runner).
      - name: acorn (the reference tools)
        run: npm i --no-save --no-audit --no-fund acorn@8
      - name: Parity u18 (pump slot kinds against the worklet with the pin-built pump.wasm)
        run: PIN_WASM_DIR="$RUNNER_TEMP/u02-wasm" BUILD_DIR="$RUNNER_TEMP/u18-build" native/tools/parity.sh u18
      # U33 gate: the pump synths hosted natively against the web's PsynCore.render with the pump-synth.wasm that build-wasm.sh just built from the pin (the same gate as the shipped-wasm run in the Linux jobs).
      - name: Parity u33 (pump synths against PsynCore.render with the pin-built pump-synth.wasm)
        run: PIN_WASM_DIR="$RUNNER_TEMP/u02-wasm" BUILD_DIR="$RUNNER_TEMP/u33-build" native/tools/parity.sh u33
      - uses: actions/upload-artifact@v4
        with:
          name: thunder_dsp-wasm-u02
          path: |
            ${{ runner.temp }}/u02-wasm/tfx.wasm
            ${{ runner.temp }}/u02-wasm/thunder-dsp.wasm
            ${{ runner.temp }}/u02-wasm/mods.wasm
            ${{ runner.temp }}/u02-wasm/pump.wasm
            ${{ runner.temp }}/u02-wasm/pump-synth.wasm
          retention-days: 7

  windows:
    name: Core (Windows x64, MSVC)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4   # U15: the tempo-locked effects' reference (fx-clk-dump.mjs, libm-dump.mjs) runs on every platform, bit-exact: Node 22 (V8 12.4) and acorn
        with: { node-version: 22 }
      - run: npm i --no-save --no-audit --no-fund acorn@8
      - run: cmake -S native -B build -A x64
      - run: cmake --build build --config Release -j
      - run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: thunder_core-windows-x64
          path: build/core/Release/thunder_core.lib
          retention-days: 7

  macos:
    name: Core (macOS universal)
    runs-on: macos-latest
    timeout-minutes: 90   # GitHub's macOS arm64 runners were slow on 24 Nov: the build alone took 41 minutes and ctest was cut off at 60
    steps:
      - uses: actions/checkout@v4
      - run: brew install gnu-sed   # native/core/third_party/prepare.sh needs GNU sed
      - uses: actions/setup-node@v4   # the fx reference fixture (fx-dump.mjs, Node 22 as on Linux) and its acorn
        with: { node-version: 22 }
      - run: npm i --no-save --no-audit --no-fund acorn@8
      - run: cmake -S native -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - run: cmake --build build -j3   # bounded: the runner has 3 cores; an unbounded -j of a two-architecture build thrashed and hit the 90-minute limit inside the build on PR #311
      - run: ctest --test-dir build --output-on-failure
      - run: lipo -info build/core/libthunder_core.a
      - uses: actions/upload-artifact@v4
        with:
          name: thunder_core-macos-universal
          path: build/core/libthunder_core.a
          retention-days: 7

  android-core:
    name: Core (Android arm64-v8a, NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build with the runner's NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "NDK: $NDK"
          cmake -S native -B build -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DCMAKE_BUILD_TYPE=Release -DTHUNDER_BUILD_TESTS=OFF
          cmake --build build -j
          file build/core/libthunder_core.a || true
      - uses: actions/upload-artifact@v4
        with:
          name: thunder_core-android-arm64
          path: build/core/libthunder_core.a
          retention-days: 7

  android-apk:
    name: Android shell v0 (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK pieces (pinned)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
      - name: Assemble the debug APK
        run: gradle -p native/android :app:testDebugUnitTest :app:assembleDebug -PbuildNumber=${{ github.run_number }} --no-daemon --stacktrace   # U36 T9: the JVM unit tests of MidiModel.kt run first
      - name: Name the APK
        run: |
          mkdir -p out
          cp native/android/app/build/outputs/apk/debug/app-debug.apk "out/thunder-plus-native-n0-android-${{ github.run_number }}.apk"
          sha256sum out/*.apk | tee out/SHA256.txt
          ls -l out
          unzip -l out/*.apk | grep -E 'lib/|assets/index.html|assets/bridge-test|classes.*dex|\.wasm' | head -30
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging out/*.apk | grep -E 'package:|sdkVersion|uses-permission|native-code|service' 
      - uses: actions/upload-artifact@v4
        with:
          name: thunder-plus-native-n0-android-apk
          path: out/
          retention-days: 30

  android-release:
    name: Attach the APK to a pre-release
    needs: android-apk
    if: ${{ github.ref == 'refs/heads/native' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[release-apk]')) || (github.event_name == 'workflow_dispatch' && inputs.release)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: thunder-plus-native-n0-android-apk
          path: out
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: native-n0-android-${{ github.run_number }}
        run: |
          # A PRE-release with a tag that is not v<number>: the desktop updater reads /releases/latest (never a pre-release)
          # and only tags of the form v<digit>. --latest=false keeps GitHub from ever calling this one "latest".
          gh release create "$TAG" out/*.apk out/SHA256.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "NATIVE TEST BUILD N0 (Android, run ${{ github.run_number }}): not the desktop app" \
            --notes "Test build of the Thunder Plus native spike (stage N0). Android debug APK, sideload only. It is NOT a release of the desktop app and the desktop updater ignores it. Steps: native/tests/OWNER-TEST-N0.md on the native branch. Commit: $GITHUB_SHA"

  # N2 H4: the RELEASE builds of the Android app, one per channel (beta, stable): own application id (app.thunderplus.android.beta / app.thunderplus.android), versionCode = this run number,
  # signed with the OWNER's keystore when the four secrets exist, else with the repository's public debug key (the APK name then ends -DEBUGKEY: it will NOT install over an owner-signed build).
  # Secrets used (the owner creates them; nothing here creates or prints one): ANDROID_KEYSTORE_B64 (the .jks / .p12, base64), ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS, ANDROID_KEY_PASS.
  # R8 is off (see native/android/app/build.gradle.kts): mapping.txt is uploaded when a build has one (-PthunderMinify=true).
  android-release-build:
    name: Android release APK (${{ matrix.channel }})
    needs: android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        channel: [beta, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK pieces (pinned)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
      # H4-1 (verifier, 25 Nov): the owner's key is read ONLY on a push to `native` and on a manual run from `native`. A pull-request job (even from a branch of this repository) never reads a secret:
      # the steps that name a secret are skipped by their `if`, and the PR build is signed with the public debug key.
      - name: The owner's keystore (push to native, or manual run from native; only when all four secrets exist)
        id: ks
        if: ${{ github.ref == 'refs/heads/native' && github.event_name != 'pull_request' }}
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            (umask 077; echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/owner.keystore")
            echo "path=$RUNNER_TEMP/owner.keystore" >> "$GITHUB_OUTPUT"
            echo "signed=signed" >> "$GITHUB_OUTPUT"
            echo "Signing with the owner's key."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "signed=DEBUGKEY" >> "$GITHUB_OUTPUT"
            echo "The owner's signing secrets are not all set: signing with the repository's public debug key (the APK name says DEBUGKEY)."
          fi
      - name: The public debug key (every pull request; no secret is read)
        id: dk
        if: ${{ !(github.ref == 'refs/heads/native' && github.event_name != 'pull_request') }}
        run: echo "signed=DEBUGKEY" >> "$GITHUB_OUTPUT"
      - name: Assemble the release APK (the owner's key)
        id: asm_owner
        if: ${{ steps.ks.outputs.signed == 'signed' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.ks.outputs.path }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: gradle -p native/android :app:assembleRelease -PthunderChannel=${{ matrix.channel }} -PbuildNumber=${{ github.run_number }} --no-daemon --stacktrace
      - name: Assemble the release APK (the public debug key)
        if: ${{ steps.ks.outputs.signed != 'signed' }}
        run: gradle -p native/android :app:assembleRelease -PthunderChannel=${{ matrix.channel }} -PbuildNumber=${{ github.run_number }} --no-daemon --stacktrace
      - name: Remove the keystore file (H4-2)
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/owner.keystore"
      - name: Name the APK, list what is in it, check the signature
        env:
          SIGNED: ${{ steps.ks.outputs.signed || steps.dk.outputs.signed }}
        run: |
          set -eo pipefail
          mkdir -p out
          N="thunder-plus-android-${{ matrix.channel }}-${{ github.run_number }}-$SIGNED"
          cp native/android/app/build/outputs/apk/release/app-release.apk "out/$N.apk"
          M=native/android/app/build/outputs/mapping/release/mapping.txt
          if [ -f "$M" ]; then cp "$M" "out/mapping-${{ matrix.channel }}-${{ github.run_number }}.txt"; else echo "no mapping.txt: R8 is off in this build (readable crash traces without it)"; fi
          (cd out && sha256sum *.apk | tee SHA256-${{ matrix.channel }}.txt)
          ls -l out
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "out/$N.apk" | grep -E "package:|application-label:|uses-permission" || true
          # H4-3: the check can fail the build. SHA-256 of the public ci-debug.keystore certificate (keytool -list -v -keystore native/android/ci-debug.keystore -storepass android).
          DEBUG_SHA=a0a17d3511ba27992683ba572d621261e41d50d8f4a91a46b2a4caa65cdcc031
          OUT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "out/$N.apk")
          echo "$OUT" | grep -E "Signer #1 certificate (DN|SHA-256)|Verifies"
          GOT=$(echo "$OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ' :' | tr 'A-F' 'a-f')
          if [ -z "$GOT" ]; then echo "::error::no signer certificate found in the APK"; exit 1; fi
          if [ "$SIGNED" = "signed" ] && [ "$GOT" = "$DEBUG_SHA" ]; then echo "::error::the APK is named -signed but carries the public debug key"; exit 1; fi
          if [ "$SIGNED" = "DEBUGKEY" ] && [ "$GOT" != "$DEBUG_SHA" ]; then echo "::error::the APK is named -DEBUGKEY but is not signed with the public debug key"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: thunder-plus-android-${{ matrix.channel }}-apk
          path: out/
          retention-days: 30

  android-release-publish:
    name: Attach the release APKs to a pre-release
    needs: android-release-build
    if: ${{ github.ref == 'refs/heads/native' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[release-apk]')) || (github.event_name == 'workflow_dispatch' && inputs.release)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        channel: [beta, stable]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: thunder-plus-android-${{ matrix.channel }}-apk
          path: out
      - name: "Create the pre-release (tag native-android-CHANNEL-RUN, which the app's Check for new build reads)"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: native-android-${{ matrix.channel }}-${{ github.run_number }}
        run: |
          # A PRE-release with a tag that is not v<number>: the desktop updater reads /releases/latest (never a pre-release) and only tags of the form v<digit>.
          # A re-run of the same run finds the release already there: nothing to do (H4-4).
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then echo "$TAG exists already"; exit 0; fi
          gh release create "$TAG" out/*.apk out/SHA256-*.txt $(ls out/mapping-*.txt 2>/dev/null) --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "Thunder Plus for Android, ${{ matrix.channel }} build ${{ github.run_number }} (native port): not the desktop app" \
            --notes "Android ${{ matrix.channel }} build ${{ github.run_number }} of the native port. Installs over the previous ${{ matrix.channel }} build of the same signing key and keeps its songs and settings. An APK named ...-DEBUGKEY.apk is signed with the public debug key and will not install over an owner-signed one. Commit: $GITHUB_SHA"

  # APK-LINK: ONE fixed URL that always serves the newest beta test APK as a plain .apk (no login, no zip), for installing from the phone:
  #   https://github.com/matthettich/thunder-plus/releases/download/android-beta-test/thunder-plus-beta-test.apk
  # It is ONE rolling pre-release with the fixed tag `android-beta-test`, updated in place (gh release upload --clobber). The tag is NOT v<digit>: the desktop updater reads /releases/latest
  # (never a pre-release) and electron/updater.js only follows tags of the form v<digit>; the Android app's Check for new build only matches ^native-android-(stable|beta|test)-<N>$. Never move this tag onto such a form.
  # Runs for pull requests from THIS repository only (a fork's token cannot write), manual runs, and pushes to native.
  android-beta-test-link:
    name: Rolling beta test APK link
    needs: android-release-build
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: android-beta-test-link
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: thunder-plus-android-beta-apk
          path: out
      - name: Publish the rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TAG=android-beta-test
          APK=$(ls out/thunder-plus-android-beta-*.apk | head -n1)
          case "$APK" in *-DEBUGKEY.apk) KEY="signed with the PUBLIC DEBUG KEY (-DEBUGKEY): it will NOT install over an owner-signed build; uninstall that one first (its songs go with it)";; *) KEY="signed with the owner's key";; esac
          BUILDNO=$(sed -n 's/^const BUILD = \([0-9][0-9]*\);.*/\1/p' index.html | head -n1)
          mkdir -p pub
          cp "$APK" pub/thunder-plus-beta-test.apk
          {
            echo "ANDROID BETA TEST BUILD (rolling): not the desktop app"
            echo "branch: $BRANCH"
            echo "pull request: ${PR_NUMBER:-none}"
            echo "head sha: $HEAD_SHA"
            echo "run: ${{ github.run_id }} $RUN_URL"
            echo "page BUILD number (index.html): ${BUILDNO:-unknown}"
            echo "built (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "apk: $(basename "$APK") ($KEY)"
            echo "sha256: $(sha256sum pub/thunder-plus-beta-test.apk | cut -d' ' -f1)"
          } > pub/BUILD.txt
          cat pub/BUILD.txt
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" pub/thunder-plus-beta-test.apk pub/BUILD.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --notes-file pub/BUILD.txt
          else
            gh release create "$TAG" pub/thunder-plus-beta-test.apk pub/BUILD.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "ANDROID BETA TEST BUILD (rolling): not the desktop app" --notes-file pub/BUILD.txt
          fi
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/thunder-plus-beta-test.apk"
          {
            echo "### Beta test APK (tap on the phone to install)"
            echo
            echo "$URL"
            echo
            echo '```'
            cat pub/BUILD.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
