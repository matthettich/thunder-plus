# Builds the desktop app (Electron) for Windows, macOS and Linux on GitHub's machines.
#
#   Try a build:     Actions → Desktop app → Run workflow. The installers are downloads on the run's page
#                    (only you can see them; they expire after 90 days).
#   Release it:      Run workflow with a version typed in (e.g. 1.1.1), or push a tag:  git tag v1.1.1  then  git push origin v1.1.1
#                    The installers go on a GitHub Release, and installed copies update themselves from it.
#                    Testers' link (always the newest): https://github.com/matthettich/thunder-plus/releases/latest
name: Desktop app

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.1.1 (leave empty for a test build)'
        required: false
        default: ''
  push:
    tags: ['v*.*.*']

# The build jobs only need to read the repo; only the release job may write (create the release).
permissions:
  contents: read

env:
  # A release: a pushed vX.Y.Z tag, or Run workflow with a version typed in.
  TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.version != '') && format('v{0}', inputs.version) || github.ref_name }}
  RELEASING: ${{ (github.event_name == 'workflow_dispatch' && inputs.version != '') || startsWith(github.ref, 'refs/tags/v') }}
  APP_DIR: electron                        # where package.json is
  RELEASE_REPO: matthettich/thunder-plus   # where releases go (the app's updater reads them from here)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: --win }
          - { os: macos-latest,   args: --mac }
          - { os: ubuntu-latest,  args: --linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Version from the release
        if: env.RELEASING == 'true'
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: npm install
      - name: Build
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          if [ -f copy-app.js ]; then node copy-app.js; fi
          npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # no signing certificate: unsigned builds
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            ${{ env.APP_DIR }}/dist/*.exe
            ${{ env.APP_DIR }}/dist/*.dmg
            ${{ env.APP_DIR }}/dist/*.zip
            ${{ env.APP_DIR }}/dist/*.AppImage
            ${{ env.APP_DIR }}/dist/*.blockmap
            ${{ env.APP_DIR }}/dist/latest*.yml

  release:
    # Only when releasing: one release with every platform's files, published when all of them built.
    permissions:
      contents: write
    if: (github.event_name == 'workflow_dispatch' && inputs.version != '') || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ls -la out
          cat > notes.md <<'EOF'
          Desktop build $TAG. Windows: the Setup .exe (or the portable .exe). Mac: the .dmg. Linux: the AppImage. Installed copies update themselves.

          These builds are not signed yet, so the first open needs a step. **Windows** shows "Windows protected your PC": click *More info* → *Run anyway*. **Mac** says the app can't be checked for malware: close that, open *System Settings → Privacy & Security*, scroll down and click *Open Anyway* next to Thunder Plus, then open it again.
          EOF
          sed -i "s/\$TAG/$TAG/g" notes.md
          if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --repo "$RELEASE_REPO" --clobber
          else
            gh release create "$TAG" out/* --repo "$RELEASE_REPO" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
          fi
