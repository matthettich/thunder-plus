# Builds the desktop app (Electron) for Windows, macOS and Linux on GitHub's machines.
# Run it from the Actions tab (Desktop app → Run workflow), or push a tag like v1.1.0 to also
# attach the installers to a GitHub Release.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: |
              electron/dist/*.exe
          - os: macos-latest
            script: dist:mac
            files: |
              electron/dist/*.dmg
          - os: ubuntu-latest
            script: dist:linux
            files: |
              electron/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: electron
        run: npm install
      - name: Build
        working-directory: electron
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # no signing certificate: unsigned builds
      - uses: actions/upload-artifact@v4
        with:
          name: thunder-plus-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
