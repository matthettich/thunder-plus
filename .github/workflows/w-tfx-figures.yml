# W-TFX (TEMPORARY, remove with the unit's merge): prints the fx / padfx / modfx figures of Linux (GCC) and macOS (arm64) next to the Windows clang-cl ones (docs/port/W-TFX-NOTES.md). Builds only the three tests.
name: W-TFX figures
on:
  pull_request:
    branches: [native]
    paths: ['.github/workflows/w-tfx-figures.yml']
jobs:
  figures:
    name: fx figures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save --no-audit --no-fund acorn@8
      - if: ${{ matrix.os == 'macos-latest' }}
        run: brew install gnu-sed
      - run: cmake -S native -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target test_fx test_padfx test_modfx -j3
      - name: figures
        run: ctest --test-dir build -R '^(fx|padfx|modfx)$' -V 2>&1
